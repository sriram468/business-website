<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lakshya Paper Plates</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7f5;
            color: #222;
            line-height: 1.5;
        }

        header {
            background: #0b6b35;
            color: white;
            padding: 18px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        header p {
            font-size: 14px;
        }

        nav {
            background: white;
            padding: 12px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        nav a {
            color: #0b6b35;
            text-decoration: none;
            margin: 0 12px;
            font-weight: bold;
            font-size: 14px;
        }

        .hero {
            background: linear-gradient(135deg, #e8f5e9, #ffffff);
            padding: 45px 20px;
            text-align: center;
        }

        .hero h2 {
            color: #0b6b35;
            font-size: 32px;
            margin-bottom: 12px;
        }

        .hero p {
            max-width: 650px;
            margin: auto;
            color: #555;
            font-size: 16px;
        }

        .buttons {
            margin-top: 25px;
        }

        .button {
            display: inline-block;
            padding: 13px 22px;
            margin: 5px;
            border-radius: 7px;
            text-decoration: none;
            font-weight: bold;
            color: white;
        }

        .call {
            background: #0b6b35;
        }

        .whatsapp {
            background: #25D366;
        }

        .products-section {
            max-width: 1100px;
            margin: auto;
            padding: 40px 18px;
        }

        .section-title {
            text-align: center;
            color: #0b6b35;
            font-size: 28px;
            margin-bottom: 30px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,0.10);
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
        }

        .product-photo {
            height: 180px;
            background: linear-gradient(135deg, #e8f5e9, #d8eadb);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0b6b35;
            font-size: 55px;
        }

        .product-info {
            padding: 18px;
        }

        .product-info h3 {
            color: #0b6b35;
            font-size: 19px;
            margin-bottom: 10px;
        }

        .details {
            font-size: 14px;
            color: #555;
            margin-bottom: 4px;
        }

        .product-button {
            display: block;
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            background: #0b6b35;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .contact {
            background: #0b6b35;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        .contact h2 {
            margin-bottom: 15px;
        }

        .contact p {
            margin-bottom: 8px;
        }

        .contact-buttons {
            margin-top: 20px;
        }

        footer {
            background: #064d26;
            color: white;
            text-align: center;
            padding: 18px;
            font-size: 13px;
        }

        @media (max-width: 800px) {
            .products {
                grid-template-columns: repeat(2, 1fr);
            }

            .hero h2 {
                font-size: 26px;
            }
        }

        @media (max-width: 550px) {
            .products {
                grid-template-columns: 1fr;
            }

            nav a {
                margin: 0 6px;
                font-size: 12px;
            }

            header h1 {
                font-size: 23px;
            }

            .hero {
                padding: 35px 15px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>LAKSHYA PAPER PLATES</h1>
        <p>Paper Plates • Leaf Plates • Silver Foil Plates • Water Glasses</p>
    </header>

    <!-- NAVIGATION -->
    <nav>
        <a href="#home">Home</a>
        <a href="#products">Products</a
